[project]
name = "magi"
version = "0.1.0"
description = "LLM-powered Ontology Creation & Analysis"
authors = [{ name = "Pinlin [Calvin] Xu" }]
requires-python = ">=3.11"
dependencies = [
    "gradio",
    "requests",
    "gqlalchemy",
    "asyncpg",
    "aiohttp",
    "pyspark",
    "fastapi",
    "python-dotenv",
    "boto3>=1.36.21",
    "openai>=0.27.10",
    "google-cloud-core>=2.4.1",
    "google-cloud-aiplatform[tokenization]>=1.80.0",
    "google-genai>=1.2.0",
    "redis>=5.0.1",
    "voyageai>=0.3.2",
    "transformers>=4.49.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]",
    "black",
    "ruff",
    "hatchling",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magi"]

[tool.hatch.build]
packages = ["src/magi"]

[dependency-groups]
dev = [
    "watchfiles>=1.0.4",
]

[tool.ruff]
line-length = 88
