services:
  magi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magi-backend
    ports:
      - "${MAGI_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - .env:/app/.env
    environment:
      - UVICORN_ENV=dev
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-magidb}
      - POSTGRES_USER=${POSTGRES_USER:-magiuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-magipassword}
      - MEMGRAPH_HOST=${MEMGRAPH_HOST:-memgraph}
      - MEMGRAPH_PORT=${MEMGRAPH_PORT:-7687}
      - MEMGRAPH_LAB_HOST=${MEMGRAPH_LAB_HOST:-memgraph-lab}
      - MEMGRAPH_LAB_PORT=${MEMGRAPH_LAB_PORT:-3000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    command: uvicorn magi.main:app --reload --host 0.0.0.0 --port ${MAGI_PORT:-8000}
    depends_on:
      - magi-frontend
      - postgres
      - memgraph
      - memgraph-lab
      - redis

  magi-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: magi-frontend
    ports:
      - "5173:5173"             # Vite dev server
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_BASE_URL=http://magi-backend:8000

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magipassword}
      POSTGRES_DB: ${POSTGRES_DB:-magidb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  memgraph:
    image: memgraph/memgraph-mage:3.0-memgraph-3.0
    container_name: memgraph-container
    ports:
      - "${MEMGRAPH_PORT:-7687}:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph

  memgraph-lab:
    image: memgraph/lab:3.0.1
    container_name: memgraph-lab-container
    ports:
      - "${MEMGRAPH_LAB_PORT:-3000}:3000"
    environment:
      MEMGRAPH_URI: memgraph
      MEMGRAPH_PORT: 7687
    depends_on:
      - memgraph

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
  memgraph-data:
  redis-data: