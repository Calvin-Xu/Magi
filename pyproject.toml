[project]
name = "magi"
version = "0.1.0"
description = "LLM-powered Ontology Builder"
authors = [{ name = "Pinlin [Calvin] Xu" }]
requires-python = ">=3.11"
dependencies = [
    "gradio",
    "requests",
    "gqlalchemy",
    "asyncpg",
    "aiohttp",
    "pyspark",
    "fastapi",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]",
    "black",
    "ruff",
    "hatchling",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magi"]

[tool.hatch.build]
packages = ["src/magi"]

[dependency-groups]
dev = [
    "watchfiles>=1.0.4",
]

[tool.ruff]
line-length = 88
