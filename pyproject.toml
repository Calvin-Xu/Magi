[project]
name = "magi"
version = "0.1.0"
description = "TBD"
readme = "README.md"
authors = [{ name = "Pinlin [Calvin] Xu" }]
requires-python = ">=3.11"
dependencies = [
    "gqlalchemy>=1.6.0",
    "pgvector>=0.3.6",
    "psycopg2>=2.9.10",
    "pyspark>=3.5.4",
    "requests>=2.32.3",
    "sentence-transformers>=3.4.1",
    "sqlalchemy>=2.0.38",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["magi*"]
